server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: payment-gateway
    static_configs:
      - targets:
          - localhost
        labels:
          job: payment-gateway
          __path__: /var/log/app/payment-gateway.json

    pipeline_stages:
      - json:
          expressions:
            level:       level
            event_type:  event_type
            msg_direction: msg_direction
            logger_name: logger_name

      # Default event_type to APP_LOG when absent (regular application logs)
      - template:
          source: event_type
          template: '{{ if .Value }}{{ .Value }}{{ else }}APP_LOG{{ end }}'

      - labels:
          level:
          event_type:
          msg_direction:
