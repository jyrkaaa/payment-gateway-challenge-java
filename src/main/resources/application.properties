server.port=8090
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true

# Reject non-integer numbers (e.g. 105.4) for integer fields instead of silently truncating them
spring.jackson.deserialization.accept-float-as-int=false

gateway.acquiring-bank.url=http://localhost:8080/payments

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.metrics.tags.application=payment-gateway
management.info.env.enabled=true
info.app.name=Payment Gateway
info.app.version=1.0.0
